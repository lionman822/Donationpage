<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>为什么要把牧区转换成自然保护区？ | Habitat Watcher Foundation</title>
  <meta name="description" content="Maasai Mara Community Conservancy Fundraising Page by Habitat Watcher Foundation" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --green-950:#052e16;
      --green-900:#14532d;
      --green-800:#166534;
      --green-700:#15803d;
      --lime-50:#f7fee7;
      --lime-100:#ecfccb;
      --lime-200:#d9f99d;
      --amber-50:#fffbeb;
      --amber-100:#fef3c7;
      --stone-950:#1c1917;
      --stone-800:#292524;
      --stone-700:#44403c;
      --stone-600:#57534e;
      --stone-500:#78716c;
      --white:#ffffff;
      --shadow:0 18px 45px rgba(20,83,45,.12);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;
      color:var(--stone-950);
      background:linear-gradient(180deg,var(--lime-50) 0%,var(--amber-50) 42%,#fff 100%);
      line-height:1.65;
    }
    a{color:inherit}
    .container{max-width:1180px;margin:0 auto;padding:0 22px}
    header{
      position:sticky;top:0;z-index:50;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(132,204,22,.25);
    }
    .nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 0;
      gap:16px;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand-icon{
      width:42px;height:42px;border-radius:16px;background:var(--green-900);color:#fff;
      display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(20,83,45,.22);
      font-size:22px;
    }
    .brand-title{font-weight:800;color:var(--green-950);letter-spacing:.2px}
    .brand-sub{font-size:12px;color:var(--stone-600);margin-top:-2px}
    .lang-btn{
      border:0;border-radius:999px;background:var(--green-900);color:#fff;
      padding:10px 18px;font-weight:800;cursor:pointer;
      box-shadow:0 10px 22px rgba(20,83,45,.18);
      transition:.2s ease;
    }
    .lang-btn:hover{background:var(--green-800);transform:translateY(-1px)}
    .hero{position:relative;overflow:hidden;padding:72px 0 56px}
    .blob-a,.blob-b{position:absolute;border-radius:999px;filter:blur(60px);opacity:.32;pointer-events:none}
    .blob-a{width:320px;height:320px;background:#bef264;left:4%;top:13%}
    .blob-b{width:420px;height:420px;background:#fcd34d;right:4%;bottom:-10%}
    .hero-grid{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:42px;align-items:center}
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      background:#dcfce7;color:var(--green-900);font-weight:800;
      padding:7px 16px;border-radius:999px;font-size:14px;margin-bottom:18px;
    }
    h1{
      margin:0;color:var(--green-950);font-size:clamp(36px,6vw,66px);line-height:1.08;
      letter-spacing:-1.8px;font-weight:950;
    }
    .hero-sub{font-size:20px;line-height:1.75;color:var(--stone-700);max-width:820px;margin:24px 0 0}
    .quote-card{
      margin-top:28px;background:rgba(255,255,255,.78);border:1px solid rgba(132,204,22,.35);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;
      display:flex;gap:14px;align-items:flex-start;
    }
    .quote-card strong{font-size:21px;line-height:1.65;color:var(--green-950)}
    .metric-grid{display:grid;gap:15px}
    .metric-card{
      display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.86);
      border:1px solid rgba(132,204,22,.35);border-radius:24px;padding:18px;box-shadow:0 12px 30px rgba(20,83,45,.10);
    }
    .metric-icon{width:50px;height:50px;border-radius:18px;background:var(--green-900);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
    .metric-label{font-size:14px;color:var(--stone-500)}
    .metric-value{font-size:29px;font-weight:950;color:var(--green-950);line-height:1.05}
    .metric-suffix{font-size:12px;color:var(--stone-500)}
    section{padding:42px 0}
    .location-card{
      background:rgba(254,243,199,.72);border:1px solid rgba(245,158,11,.22);
      border-radius:var(--radius);padding:24px;display:grid;grid-template-columns:220px 1fr;gap:18px;box-shadow:0 10px 28px rgba(146,64,14,.06)
    }
    .section-title{font-size:32px;line-height:1.2;margin:0 0 24px;color:var(--green-950);font-weight:950}
    .three-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .four-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .card{
      background:#fff;border:1px solid rgba(132,204,22,.28);border-radius:var(--radius);
      box-shadow:0 10px 28px rgba(20,83,45,.07);padding:24px;
    }
    .card h2,.card h3{color:var(--green-950);line-height:1.25;margin:0 0 14px}
    .card h2{font-size:24px}.card h3{font-size:21px}
    .card p{color:var(--stone-700);margin:0}
    .icon-title{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .icon{font-size:26px;color:var(--green-900)}
    .list{display:grid;gap:10px;margin-top:18px}
    .list-item{
      display:flex;gap:10px;align-items:flex-start;background:var(--lime-50);
      border-radius:16px;padding:12px;color:var(--stone-700);font-size:15px;
    }
    .num{
      flex:none;width:24px;height:24px;background:var(--green-900);color:#fff;border-radius:999px;
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
    }
    .progress-wrap{margin-top:22px;display:grid;gap:12px}
    .progress-row{display:grid;gap:5px}
    .progress-label{display:flex;justify-content:space-between;color:var(--stone-500);font-size:12px}
    .progress-bar{height:9px;background:#e7f7cf;border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--green-900),#84cc16);border-radius:999px}
    .benefit-card{transition:.2s ease}
    .benefit-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .benefit-icon{width:52px;height:52px;border-radius:18px;background:#dcfce7;color:var(--green-900);display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:16px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#dcfce7;border-radius:18px;padding:6px;margin-bottom:22px}
    .tab-btn{
      border:0;background:transparent;border-radius:14px;padding:12px 10px;font-weight:900;color:var(--green-950);cursor:pointer;
    }
    .tab-btn.active{background:#fff;box-shadow:0 8px 20px rgba(20,83,45,.10)}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .two-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px}
    .two-grid-even{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .mini-row{
      border:1px solid rgba(132,204,22,.2);background:rgba(247,254,231,.62);
      border-radius:18px;padding:15px;margin-bottom:12px;
    }
    .mini-row-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .pill{background:var(--green-800);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900;white-space:nowrap}
    .small-muted{color:var(--stone-500);font-size:13px;margin-top:8px}
    .chart-card{background:#fff;border:1px solid rgba(132,204,22,.28);border-radius:var(--radius);box-shadow:0 10px 28px rgba(20,83,45,.07);padding:20px;min-height:410px}
    canvas{max-width:100%}
    .budget-row,.donation-row{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      background:rgba(247,254,231,.72);border-radius:18px;padding:15px;margin-bottom:10px;
    }
    .budget-name,.donation-name{font-weight:800;color:var(--green-950)}
    .budget-detail{font-size:12px;color:var(--stone-500)}
    .amount{font-weight:950;color:var(--green-900);white-space:nowrap}
    .donation-amount{background:var(--green-900);color:#fff;border-radius:999px;padding:5px 11px;font-weight:900;white-space:nowrap}
    .materials{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
    .material-tag{border:1px solid rgba(22,101,52,.25);background:#fff;color:var(--green-950);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
    .footer-cta{
      background:var(--green-950);color:#fff;border-radius:36px;box-shadow:0 24px 60px rgba(5,46,22,.24);
      padding:34px;display:grid;grid-template-columns:1fr .78fr;gap:26px;align-items:center;
    }
    .footer-cta h2{font-size:34px;line-height:1.32;margin:0;color:#fff}
    .footer-badge{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.10);border-radius:999px;padding:8px 14px;font-size:14px;margin-bottom:14px}
    .mini-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .mini-stat{background:rgba(255,255,255,.1);border-radius:22px;padding:18px}
    .mini-stat-value{font-size:24px;font-weight:950}
    .mini-stat-label{font-size:13px;color:rgba(255,255,255,.72);margin-top:3px}
    .fade-in{animation:fade .55s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media (max-width:920px){
      .hero-grid,.three-grid,.four-grid,.two-grid,.two-grid-even,.footer-cta,.location-card{grid-template-columns:1fr}
      .metric-grid{grid-template-columns:repeat(2,1fr)}
      .tabs{grid-template-columns:1fr}
      .brand-sub{display:none}
    }
    @media (max-width:560px){
      .container{padding:0 16px}
      .hero{padding:48px 0 32px}
      .metric-grid,.mini-stat-grid{grid-template-columns:1fr}
      .quote-card strong{font-size:18px}
      .footer-cta h2{font-size:25px}
      .budget-row,.donation-row{align-items:flex-start;flex-direction:column}
      .lang-btn{padding:9px 13px}
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <div class="brand-icon">🐾</div>
        <div>
          <div class="brand-title">Habitat Watcher Foundation</div>
          <div class="brand-sub">Maasai Mara Community Conservancies</div>
        </div>
      </div>
      <button class="lang-btn" id="langBtn">🌐 English</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="blob-a"></div>
      <div class="blob-b"></div>
      <div class="container hero-grid">
        <div class="fade-in">
          <div class="badge" id="heroTag"></div>
          <h1 id="heroTitle"></h1>
          <p class="hero-sub" id="heroSubtitle"></p>
          <div class="quote-card">
            <div class="icon">🤝</div>
            <strong id="oneLine"></strong>
          </div>
        </div>
        <div class="metric-grid fade-in">
          <div class="metric-card">
            <div class="metric-icon">🌱</div>
            <div><div class="metric-label" id="metricAcres"></div><div class="metric-value" id="totalAcres"></div><div class="metric-suffix" id="acreSuffix"></div></div>
          </div>
          <div class="metric-card">
            <div class="metric-icon">🌍</div>
            <div><div class="metric-label" id="metricSqKm"></div><div class="metric-value" id="totalSqKm"></div><div class="metric-suffix">km²</div></div>
          </div>
          <div class="metric-card">
            <div class="metric-icon">🛡️</div>
            <div><div class="metric-label" id="metricRangers"></div><div class="metric-value" id="totalRangers"></div><div class="metric-suffix" id="rangerSuffix"></div></div>
          </div>
          <div class="metric-card">
            <div class="metric-icon">👥</div>
            <div><div class="metric-label" id="metricBudget"></div><div class="metric-value" id="totalBudget"></div><div class="metric-suffix" id="yearSuffix"></div></div>
          </div>
        </div>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="container">
        <div class="location-card">
          <div class="icon-title">
            <div class="icon">📍</div>
            <h2 id="locationTitle" style="margin:0;color:var(--green-950)"></h2>
          </div>
          <div>
            <div id="country"></div>
            <div id="region"></div>
            <div id="coord"></div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="container three-grid">
        <div class="card">
          <div class="icon-title"><div class="icon">🌱</div><h2 id="problemTitle"></h2></div>
          <p id="problemText"></p>
          <div class="list" id="problemList"></div>
        </div>
        <div class="card">
          <div class="icon-title"><div class="icon">🌍</div><h2 id="consequencesTitle"></h2></div>
          <div class="list" id="consequenceList"></div>
        </div>
        <div class="card">
          <div class="icon-title"><div class="icon">🛡️</div><h2 id="solutionTitle"></h2></div>
          <p id="solutionText"></p>
          <div class="progress-wrap" id="progressList"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title" id="benefitsTitle"></h2>
        <div class="four-grid" id="benefitGrid"></div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="tabs">
          <button class="tab-btn active" data-tab="conservancies" id="tabConservancies"></button>
          <button class="tab-btn" data-tab="budget" id="tabBudget"></button>
          <button class="tab-btn" data-tab="donation" id="tabDonation"></button>
        </div>

        <div class="tab-panel active" id="panel-conservancies">
          <div class="two-grid">
            <div class="card">
              <h2 id="conservanciesTitle"></h2>
              <div id="conservancyList"></div>
            </div>
            <div class="chart-card">
              <h2 id="chartConservancy"></h2>
              <canvas id="conservancyChart"></canvas>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-budget">
          <div class="two-grid-even">
            <div class="chart-card">
              <h2 id="chartBudget"></h2>
              <canvas id="budgetChart"></canvas>
            </div>
            <div class="card">
              <h2 id="annualBudgetTotal"></h2>
              <p id="budgetNote" style="margin-bottom:18px"></p>
              <div id="budgetList"></div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-donation">
          <div class="two-grid">
            <div class="card">
              <h2 id="donationTitle"></h2>
              <div id="donationList"></div>
            </div>
            <div>
              <div class="chart-card" style="margin-bottom:22px;min-height:320px">
                <h2 id="chartIncome"></h2>
                <canvas id="incomeChart"></canvas>
              </div>
              <div class="card" style="background:var(--amber-50);border-color:rgba(245,158,11,.25)">
                <div class="icon-title"><div class="icon">🚙</div><h2 id="materialsTitle"></h2></div>
                <div class="materials" id="materialsList"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <section>
      <div class="container">
        <div class="footer-cta">
          <div>
            <div class="footer-badge">📷 Community Conservancy Fund</div>
            <h2 id="footerText"></h2>
          </div>
          <div class="mini-stat-grid" id="miniStats"></div>
        </div>
      </div>
    </section>
  </main>

        region: "Region: Maasai Mara",
        coord: "Coordinates: 1.49° S, 35.14° E",
        problemTitle: "1. The Problem We Must Address",
        problemText: "The Maasai are traditionally pastoralists who have lived for generations along the Kenya–Tanzania border, sharing the landscape with wildlife. Population growth, rising livestock numbers, and overgrazing have placed severe ecological pressure on the rangelands.",
        problems: ["Soil erosion", "Vegetation degradation", "Biodiversity loss", "Shrinking wildlife habitat", "Limited household income"],
        consequencesTitle: "2. Consequences of Rangeland Degradation",
        consequences: ["Drought impacts intensify, making water access harder for people and livestock.", "Rainy-season floods become more damaging, threatening homes and livestock enclosures.", "Wildlife loses habitat, and populations decline.", "Ecological imbalance increases pest and disease risks.", "Living conditions deteriorate, and household income declines."],
        solutionTitle: "3. The Solution",
        solutionText: "Selected pastoral areas can be converted into community conservancies through land leases, ranger systems, ecotourism, and ecological monitoring, shifting land use from single-purpose grazing toward conservation-linked community development.",
        progress: ["Land-lease mechanism", "Reduced grazing pressure", "Ecotourism income", "Monitoring capacity"],
        benefitsTitle: "4. Benefits for Pastoralists and Communities",
        benefits: [
          { title: "Improved environment", text: "Vegetation recovery strengthens water retention and helps reduce drought, flood, and pest impacts.", icon:"🌱" },
          { title: "Diversified income", text: "Land leases, ranger salaries, guiding, tourism services, and local enterprises create a broader income base.", icon:"🤝" },
          { title: "Higher household income", text: "Some pastoralist households may increase annual income from about US$500 to about US$3,700.", icon:"👥" },
          { title: "Community welfare", text: "Conservancy benefits can support schools, water infrastructure, women’s livelihoods, and youth training.", icon:"🌍" }
        ],
        conservanciesTitle: "5. Priority Conservancies",
        budgetTitle: "6. Estimated Basic Annual Budget",
        budgetNote: "This basic budget excludes 4x4 vehicles, motorcycles, new ranger posts, bulk camera-trap purchases, and predator-proof boma construction.",
        donationTitle: "7. Sponsorable Items",
        materialsTitle: "8. In-kind Support Needed",
        materials: ["4x4 vehicles", "Motorcycles", "Camera traps", "Smartphones", "Flashlights", "Headlamps", "Binoculars", "Handheld video cameras", "Laptops", "Solid-state drives", "Radios", "Ranger uniforms", "Leather boots", "Rain gear", "Sleeping bags", "Field kitchenware", "Solar lighting", "Water storage equipment"],
        chartConservancy: "Conservancy Area and Ranger Force",
        chartBudget: "Basic Annual Budget Structure",
        chartIncome: "Illustrative Household Income Growth",
        metricAcres: "Protected Area",
        metricSqKm: "Approx. sq. km",
        metricRangers: "Rangers",
        metricBudget: "Basic Annual Budget",
        acre: "acres",
        rangers: "rangers",
        perYear: "per year",
        annualBudgetTotal: "Total Basic Annual Budget",
        footer: "A conservancy is not merely a boundary on a map. It is a new social contract: restored grasslands, connected wildlife corridors, and a future with dignity for local communities.",
        singleGrazing:"Single-source pastoral income",
        conservancyIncome:"Conservancy-linked income",
        annualIncome:"Annual income",
        miniStats:[
          ["Protect 1 acre/year",20],
          ["1 ranger/month",120],
          ["1 predator-proof boma",2500],
          ["1 ranger 4x4",60000]
        ]
      }
    };

    const conservancies = [
      { zh: "纳书莱马赛保护区", en: "Nashulai Maasai Conservancy", acres: 5000, rangers: 18 },
      { zh: "马拉瑞波伊保护区", en: "Mara Ripoi Conservancy", acres: 13500, rangers: 33 },
      { zh: "奥拉罗保护区", en: "Olarro Conservancy", acres: 20000, rangers: 20 }
    ];

    const budget = [
      { zh: "土地租金", en: "Land leases", amount: 770000, detailZh: "38,500英亩 × 20美元/英亩/年", detailEn: "38,500 acres × US$20/acre/year" },
      { zh: "巡护员工资", en: "Ranger salaries", amount: 102240, detailZh: "71人 × 120美元/月 × 12个月", detailEn: "71 rangers × US$120/month × 12" },
      { zh: "巡护员食物", en: "Ranger food", amount: 103660, detailZh: "71人 × 4美元/天 × 365天", detailEn: "71 rangers × US$4/day × 365" },
      { zh: "燃油维修保养", en: "Fuel & maintenance", amount: 14400, detailZh: "1200美元/月 × 12个月", detailEn: "US$1,200/month × 12" },
      { zh: "巡护装备", en: "Ranger gear", amount: 5207, detailZh: "71人 × 220美元 ÷ 3年", detailEn: "71 rangers × US$220 ÷ 3 years" },
      { zh: "手机摄影装备", en: "Phones & photography", amount: 7100, detailZh: "71人 × 300美元 ÷ 3年", detailEn: "71 rangers × US$300 ÷ 3 years" },
      { zh: "厨具", en: "Kitchenware", amount: 100, detailZh: "基础年预算", detailEn: "Basic annual allocation" }
    ];

    const donationItems = [
      { zh: "支持1英亩保护区土地租金1年", en: "Lease 1 acre of conservancy land for 1 year", amount: 20 },
      { zh: "支持1名巡护员1天食物", en: "Feed 1 ranger for 1 day", amount: 4 },
      { zh: "支持1名巡护员1个月工资", en: "Support 1 ranger salary for 1 month", amount: 120 },
      { zh: "支持1名巡护员基础装备", en: "Equip 1 ranger with basic field gear", amount: 220 },
      { zh: "支持1名巡护员手机与摄影装备", en: "Provide smartphone and photography kit for 1 ranger", amount: 300 },
      { zh: "支持1台红外相机", en: "Provide 1 camera trap", amount: 60 },
      { zh: "支持1辆摩托车", en: "Provide 1 ranger motorcycle", amount: 1500 },
      { zh: "支持1个防狮围栏", en: "Build 1 predator-proof boma", amount: 2500 },
      { zh: "支持1个巡护站", en: "Build 1 ranger post", amount: 10000 },
      { zh: "支持1辆巡护越野车", en: "Provide 1 ranger 4x4 vehicle", amount: 60000 }
    ];

    let lang = "zh";
    let conservancyChart, budgetChart, incomeChart;

    function money(value){
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(value);
    }

    function setText(id, text){ document.getElementById(id).textContent = text; }

    function renderList(containerId, items){
      document.getElementById(containerId).innerHTML = items.map((item, i) => `
        <div class="list-item"><span class="num">${i+1}</span><span>${item}</span></div>
      `).join("");
    }

    function render(){
      const t = copy[lang];
      const totalAcres = conservancies.reduce((s,c)=>s+c.acres,0);
      const totalRangers = conservancies.reduce((s,c)=>s+c.rangers,0);
      const totalBudget = budget.reduce((s,b)=>s+b.amount,0);
      const sqKm = Math.round(totalAcres * 0.00404686);

      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "为什么要把牧区转换成自然保护区？" : "Why Convert Pastoral Rangelands into Conservancies?";
      setText("langBtn", "🌐 " + t.langName);
      setText("heroTag", t.heroTag);
      setText("heroTitle", t.heroTitle);
      setText("heroSubtitle", t.heroSubtitle);
      setText("oneLine", t.oneLine);
      setText("metricAcres", t.metricAcres);
      setText("metricSqKm", t.metricSqKm);
      setText("metricRangers", t.metricRangers);
      setText("metricBudget", t.metricBudget);
      setText("totalAcres", totalAcres.toLocaleString());
      setText("totalSqKm", sqKm.toLocaleString());
      setText("totalRangers", totalRangers.toLocaleString());
      setText("totalBudget", money(totalBudget));
      setText("acreSuffix", t.acre);
      setText("rangerSuffix", t.rangers);
      setText("yearSuffix", t.perYear);
      setText("locationTitle", t.location);
      setText("country", t.country);
      setText("region", t.region);
      setText("coord", t.coord);
      setText("problemTitle", t.problemTitle);
      setText("problemText", t.problemText);
      setText("consequencesTitle", t.consequencesTitle);
      setText("solutionTitle", t.solutionTitle);
      setText("solutionText", t.solutionText);
      setText("benefitsTitle", t.benefitsTitle);
      setText("tabConservancies", t.conservanciesTitle);
      setText("tabBudget", t.budgetTitle);
      setText("tabDonation", t.donationTitle);
      setText("conservanciesTitle", t.conservanciesTitle);
      setText("chartConservancy", t.chartConservancy);
      setText("chartBudget", t.chartBudget);
      setText("chartIncome", t.chartIncome);
      setText("annualBudgetTotal", `${t.annualBudgetTotal}: ${money(totalBudget)}`);
      setText("budgetNote", t.budgetNote);
      setText("donationTitle", t.donationTitle);
      setText("materialsTitle", t.materialsTitle);
      setText("footerText", t.footer);

      renderList("problemList", t.problems);
      renderList("consequenceList", t.consequences);

      const progressVals = [80,64,72,58];
      document.getElementById("progressList").innerHTML = t.progress.map((label,i)=>`
        <div class="progress-row">
          <div class="progress-label"><span>${label}</span><span>${progressVals[i]}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${progressVals[i]}%"></div></div>
        </div>
      `).join("");

      document.getElementById("benefitGrid").innerHTML = t.benefits.map(b=>`
        <div class="card benefit-card">
          <div class="benefit-icon">${b.icon}</div>
          <h3>${b.title}</h3>
          <p>${b.text}</p>
        </div>
      `).join("");

      document.getElementById("conservancyList").innerHTML = conservancies.map(c=>{
        const name = lang === "zh" ? c.zh : c.en;
        return `
          <div class="mini-row">
            <div class="mini-row-top"><strong>${name}</strong><span class="pill">${c.rangers} ${t.rangers}</span></div>
            <div class="small-muted">${c.acres.toLocaleString()} ${t.acre}</div>
            <div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${(c.acres/20000)*100}%"></div></div>
          </div>
        `;
      }).join("");

      document.getElementById("budgetList").innerHTML = budget.map(b=>`
        <div class="budget-row">
          <div>
            <div class="budget-name">${lang === "zh" ? b.zh : b.en}</div>
            <div class="budget-detail">${lang === "zh" ? b.detailZh : b.detailEn}</div>
          </div>
          <div class="amount">${money(b.amount)}</div>
        </div>
      `).join("");

      document.getElementById("donationList").innerHTML = donationItems.map(item=>`
        <div class="donation-row">
          <div class="donation-name">${lang === "zh" ? item.zh : item.en}</div>
          <div class="donation-amount">${money(item.amount)}</div>
        </div>
      `).join("");

      document.getElementById("materialsList").innerHTML = t.materials.map(m=>`<span class="material-tag">${m}</span>`).join("");
      document.getElementById("miniStats").innerHTML = t.miniStats.map(([label, value])=>`
        <div class="mini-stat"><div class="mini-stat-value">${money(value)}</div><div class="mini-stat-label">${label}</div></div>
      `).join("");

      renderCharts();
    }

    function renderCharts(){
      const t = copy[lang];
      const chartTextColor = "#44403c";
      const gridColor = "rgba(120,113,108,.18)";
      const conservancyLabels = conservancies.map(c => lang === "zh" ? c.zh : c.en);
      const budgetLabels = budget.map(b => lang === "zh" ? b.zh : b.en);

      if(conservancyChart) conservancyChart.destroy();
      if(budgetChart) budgetChart.destroy();
      if(incomeChart) incomeChart.destroy();

      conservancyChart = new Chart(document.getElementById("conservancyChart"), {
        type: "bar",
        data: {
          labels: conservancyLabels,
          datasets: [
            { label: t.acre, data: conservancies.map(c=>c.acres), backgroundColor: "#166534", borderRadius: 12, yAxisID: "y" },
            { label: t.rangers, data: conservancies.map(c=>c.rangers), backgroundColor: "#84cc16", borderRadius: 12, yAxisID: "y1" }
          ]
        },
        options: {
          responsive:true,
          maintainAspectRatio:false,
          plugins:{ legend:{labels:{color:chartTextColor}}, tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${ctx.raw.toLocaleString()}`}}},
          scales:{
            x:{ticks:{color:chartTextColor},grid:{display:false}},
            y:{position:"left",ticks:{color:chartTextColor},grid:{color:gridColor}},
            y1:{position:"right",ticks:{color:chartTextColor},grid:{drawOnChartArea:false}}
          }
        }
      });

      budgetChart = new Chart(document.getElementById("budgetChart"), {
        type: "doughnut",
        data: {
          labels: budgetLabels,
          datasets: [{ data: budget.map(b=>b.amount), backgroundColor: COLORS, borderWidth: 2, borderColor: "#fff" }]
        },
        options: {
          responsive:true,
          maintainAspectRatio:false,
          plugins:{ legend:{position:"bottom",labels:{color:chartTextColor,boxWidth:14}}, tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${money(ctx.raw)}`}}}
        }
      });

      incomeChart = new Chart(document.getElementById("incomeChart"), {
        type: "line",
        data: {
          labels: [t.singleGrazing, t.conservancyIncome],
          datasets: [{
            label: t.annualIncome,
            data: [500,3700],
            borderColor:"#166534",
            backgroundColor:"rgba(132,204,22,.25)",
            fill:true,
            tension:.35,
            pointRadius:6,
            pointBackgroundColor:"#14532d"
          }]
        },
        options: {
          responsive:true,
          maintainAspectRatio:false,
          plugins:{ legend:{labels:{color:chartTextColor}}, tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${money(ctx.raw)}`}}},
          scales:{x:{ticks:{color:chartTextColor},grid:{display:false}},y:{ticks:{color:chartTextColor},grid:{color:gridColor}}}
        }
      });
    }

    document.getElementById("langBtn").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      render();
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
        setTimeout(renderCharts, 30);
      });
    });

    render();
  </script>
</body>
</html>
